name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # Valores falsos: o build do CI não vai para produção, só valida que compila.
    # O scripts/set-env.js exige que todas as variáveis existam.
    env:
      FIREBASE_API_KEY: ci-dummy
      FIREBASE_AUTH_DOMAIN: ci-dummy
      FIREBASE_PROJECT_ID: ci-dummy
      FIREBASE_STORAGE_BUCKET: ci-dummy
      FIREBASE_MESSAGING_SENDER_ID: ci-dummy
      FIREBASE_APP_ID: ci-dummy
      FIREBASE_MEASUREMENT_ID: ci-dummy
      EMAILJS_SERVICE_ID: ci-dummy
      EMAILJS_TEMPLATE_ID: ci-dummy
      EMAILJS_PUBLIC_KEY: ci-dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
