<header class="header">
  <app-nav-brand [name]="brandName()" />
  <app-nav-menu [projectCount]="projectCount()" />
  <button type="button" class="bs-hamburger" [class.bs-open]="isBsOpen()" (click)="toggleBs()" aria-label="Abrir menu">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="bs-backdrop" [class.bs-active]="isBsOpen()" (click)="closeBs()"></div>
<div class="bs-sheet" [class.bs-active]="isBsOpen()">
  <div class="bs-handle"></div>
  <a class="bs-link" href="#projects" (click)="closeBs()">
    Projetos Selecionados
    @if (projectCount() > 0) {
      <span class="bs-badge">{{ projectCount() }}</span>
    }
  </a>
  <a class="bs-link" href="#about" (click)="closeBs()">Sobre</a>
  <a class="bs-link" href="#contact" (click)="closeBs()">Fale comigo</a>
</div>
